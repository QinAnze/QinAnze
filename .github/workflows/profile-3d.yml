name: 3D Contributions

on:
  schedule:
    - cron: "0 18 * * 0" # 每周日 18:00 UTC == 周一 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publish to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf --cached . > /dev/null
          git add profile-3d-contrib
          git commit -m "chore: update 3d contributions"
          git push --force origin output:output
